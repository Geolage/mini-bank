services:
  db:
    image: postgres:16-alpine
    container_name: mini-bank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
      POSTGRES_DB: minibank
    ports:
      - "5432:5432"
    volumes:
      - minibank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d minibank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minibank_pgdata:
