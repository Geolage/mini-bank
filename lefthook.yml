# Git hooks: keep every commit formatted, linted and conventionally named.
# Installed automatically by `pnpm install` (root "prepare" script).
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,cjs,json,css,md,yml,yaml,html}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      run: pnpm lint

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    unit-tests:
      run: pnpm test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
